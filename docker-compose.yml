services:
  rag-service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - ./rag_service/.env
    environment:
      - RAG_PORT=8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  mediai-app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - RAG_SERVICE_URL=http://rag-service:8001
    env_file:
      - .env
    command: sh -c "npm install && npm run dev"
    depends_on:
      rag-service:
        condition: service_healthy
